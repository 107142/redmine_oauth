  oauth_self_registration_domains: Allowed domains (comma-separated)
  oauth_self_registration_domains_info: |
    Users whose email address is at one of these domains (or a subdomain) are activated automatically.
    All other new users are created pending administrator approval. Example: example.com, partner.org
  oauth_hide_login_form: Hide login form
  oauth_update_login_info: Update the user's profile after a successful login.
  oauth_logout: OAuth logout
  oauth_logout_info: Log out from the OAuth provider too after Redmine logout.
  oauth_login: OAuth login
  oauth_login_info: Allow users to log in automatically via OAuth provider skipping the login form.
  oauth_custom_logout_endpoint_info: Application Logout endpoint.
  oauth_validate_user_roles_info: "A key, where user roles are present in the token. If set, values listed in
    'Login role name' grant access, values listed in 'Admin role name' grant admin rights (and also access).
    If none of those values are present, access is denied. If every admin value is missing, admin rights are revoked.
    Claim values and configured names are percent-decoded before comparison ('%20' equals a space; '+' is kept).
    E.g.: Enter 'eduperson_entitlement' or 'resource_access.redmine.roles'."
  oauth_autologin: Autologin with OAuth provider
  oauth_version_info: Endpoint version
  oauth_enable_group_roles_info: |
    When enabled, any additional roles outside the configured login/admin values are mapped to a group of the same name
    (exact match after percent-decoding). Meaning, if you create a group called 'developer' and your user has a role
    called 'developer', the user will be added to that group.

    Users will be removed from any group that is not part of their roles if this option is enabled, meaning if you
    manually add a user to the 'developer' group but they don't have the role in your identity provider, the user
    will be removed from that group.

    Group names use Redmine's existing 255-character lastname limit. Create the group with the percent-decoded URN.
  oauth_login_role_name_info: |
    Claim values that grant login. Comma or newline separated. Empty = 'user'. Percent-encoded URNs are decoded
    before matching, so '%20' and a space are the same value. '+' is not turned into a space. Max 1024 bytes per value.
  oauth_admin_role_name_info: |
    Claim values that grant Redmine administrator (and login). Comma or newline separated. Empty = 'admin'.
    Percent-decoded before matching. Max 1024 bytes per value.
  oauth_only_login: OAuth-only login
  oauth_only_login_info: |
    When enabled, users will be redirected straight to the OAuth provider, entirely skipping the standard login page. 
    Though, you can force the standard login page by adding 'nosso' parameter into the login URL, e.g. '/login?nosso'.
  identify_user_by_info: Provider's field to identify the user in Redmine

