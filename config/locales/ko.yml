  oauth_create_missing_groups_info: |
    그룹 역할과 함께 켜면 디코딩된 클레임 값으로 없는 그룹을 만들고 사용자를 추가합니다. 기본값은 꺼짐.
  oauth_group_exclude_list_info: |
    그룹으로 만들지 않을 클레임 값. 쉼표 또는 줄바꿈으로 구분. 이미 있는 그룹에는 영향을 주지 않습니다.
  oauth_login_role_name_info: |
    로그인을 허용하는 클레임 값. 쉼표 또는 줄바꿈으로 구분. 비우면 'user'.
  oauth_admin_role_name_info: |
    Redmine 관리자 권한(및 로그인)을 부여하는 클레임 값. 쉼표 또는 줄바꿈으로 구분. 비우면 'admin'.
