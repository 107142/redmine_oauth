  oauth_login_info: 사용자가 로그인 폼을 건너뛰고 OAuth 제공자를 통해 자동으로 로그인할 수 있도록 허용합니다.
  oauth_custom_logout_endpoint_info: 애플리케이션 로그아웃 엔드포인트.
  oauth_validate_user_roles_info: "토큰에서 사용자 역할이 있는 키. 설정하면 '로그인 역할 이름'에 나열된 값은 접근을 허용하고,
    '관리자 역할 이름'에 나열된 값은 관리자 권한(및 접근)을 부여합니다.
    해당 값이 하나도 없으면 접근이 거부됩니다. 관리자 값이 모두 없으면 관리자 권한이 취소됩니다."
  oauth_autologin: OAuth로 자동 로그인
  oauth_version_info: 엔드포인트 버전
  oauth_enable_group_roles_info: |
    활성화되면 설정된 로그인/관리자 값 밖의 추가 역할이 같은 이름의 그룹에 매핑됩니다.
    이 옵션이 켜져 있으면 자신의 역할에 없는 그룹에서 사용자가 제거됩니다.
    즉, 'developer' 그룹에 사용자를 직접 추가해도 ID 제공자에 해당 역할이 없으면 그 그룹에서 제거됩니다.
  oauth_only_login: OAuth 전용 로그인
  oauth_only_login_info: |
    활성화되면, 사용자는 표준 로그인 페이지를 완전히 건너뛰고 바로 OAuth 제공자로 리디렉션됩니다.
    Though, you can force the standard login page by adding 'nosso' parameter into the login URL, e.g. '/login?nosso'.
  identify_user_by_info: Redmine에서 사용자를 식별하기 위한 제공자의 필드

