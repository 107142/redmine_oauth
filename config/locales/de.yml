  oauth_login_info: Ermöglicht der Benutzer automatisches Anmelden über den OAuth-Anbieter ohne des Anmeldeformulars.
  oauth_custom_logout_endpoint_info: Abmeldung-Endpunkt für Abmeldung vom OAuth-Anbieter.
  oauth_validate_user_roles_info: "Ein Schlüssel, unter dem Benutzerrollen im Token vorhanden sind. Wenn gesetzt, gewähren die unter
    'Anmelde-Rolle' aufgeführten Werte Zugriff, die unter 'Admin-Rolle' aufgeführten Werte Admin-Rechte (und auch Zugriff).
    Wenn keiner dieser Werte vorhanden ist, wird der Zugriff verweigert. Fehlen alle Admin-Werte, werden die Admin-Rechte entzogen."
  oauth_autologin: Automatische Anmeldung mit OAuth
  oauth_version_info: Endpunkt-Version
  oauth_enable_group_roles_info: |
    Wenn aktiviert, werden zusätzliche Rollen außerhalb der konfigurierten Anmelde-/Admin-Werte einer Gruppe
    desselben Namens zugeordnet. Benutzer werden aus jeder Gruppe entfernt, die nicht zu ihren Rollen gehört,
    wenn diese Option aktiviert ist. Das heißt, wenn Sie einen Benutzer manuell zur Gruppe 'developer' hinzufügen,
    er diese Rolle aber beim Identitätsanbieter nicht hat, wird er aus dieser Gruppe entfernt.
  oauth_only_login: Nur OAuth-Anmeldung
  oauth_only_login_info: |
    Wenn diese Option aktiviert ist, werden Benutzer direkt zum OAuth-Anbieter weitergeleitet, wodurch die Standard-Anmeldeseite vollständig übersprungen wird.
    Trotzdem können Sie die Standard-Login-Seite erzwingen, indem du den Parameter 'nosso' in die Login-URL einfügst, 
    z.B. '/login?nosso'.
  identify_user_by_info: Anbieter-Feld zur Identifikation des Benutzers im Redmine

