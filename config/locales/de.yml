    Zusammen mit Gruppenrollen wird eine fehlende Gruppe aus dem dekodierten Claim-Wert erstellt und der Benutzer
    hinzugefügt. Standardmäßig aus.
  oauth_group_exclude_list_info: |
    Claim-Werte, die nicht als Gruppen erstellt werden dürfen. Durch Komma oder Zeilenumbruch getrennt.
    Hat keine Auswirkung auf bereits vorhandene Gruppen.
  oauth_login_role_name_info: |
    Claim-Werte, die die Anmeldung erlauben. Durch Komma oder Zeilenumbruch getrennt. Leer = 'user'.
  oauth_admin_role_name_info: |
    Claim-Werte, die Redmine-Administratorrechte (und Anmeldung) vergeben. Durch Komma oder Zeilenumbruch getrennt.
    Leer = 'admin'.
