  oauth_self_registration_domains_info: |
    Benutzer, deren E-Mail-Adresse bei einer dieser Domains (oder einer Subdomain) liegt, werden automatisch aktiviert.
    Alle anderen neuen Benutzer werden unter Genehmigung des Administrators erstellt. Beispiel: example.com, partner.org
  oauth_hide_login_form: Login-Formular ausblenden
  oauth_update_login_info: Aktualizieren das Benutzerprofil nach einer erfolgreichen Anmeldung.
