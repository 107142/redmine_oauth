    Users whose email address is at one of these domains (or a subdomain) are activated automatically.
    All other new users are created pending administrator approval. Example: example.com, partner.org
  oauth_hide_login_form: Ocultar formulario de login
  oauth_update_login_info: Actualizar la información de perfil del usuario después de una autenticación correcta
  oauth_logout: OAuth logout
  oauth_logout_info: Cerrar la sesión en el proveedor OAuth después de cerrar la sesión de Redmine
  oauth_login: OAuth login
  oauth_login_info: Permitir a los usuarios autenticarse automáticamente a través del proveedor OAuth sin utilizar el formulario de login
  oauth_custom_logout_endpoint_info: Application Logout endpoint.
  oauth_validate_user_roles_info: "Clave donde están los roles de usuario en el token. Si se configura, los valores de
    'Nombre del rol de acceso' conceden acceso, los de 'Nombre del rol de administrador' conceden derechos de administrador (y también acceso).
    Si no está presente ninguno de esos valores, se deniega el acceso. Si faltan todos los valores de administrador, se revocan los derechos de administrador."
  oauth_autologin: Autologin mediante OAuth
  oauth_version_info: Endpoint versión
  oauth_enable_group_roles_info: |
    Si está activado, los roles adicionales fuera de los valores configurados de acceso/administrador se asignan a un
    grupo del mismo nombre. El usuario será eliminado de cualquier grupo que no forme parte de sus roles si esta opción
    está activada. Es decir, si añade manualmente un usuario al grupo 'developer' pero no tiene ese rol en el proveedor
    de identidad, será eliminado de ese grupo.
  oauth_only_login: OAuth-only login
  oauth_only_login_info: |
    When enabled, users will be redirected straight to the OAuth provider, entirely skipping the standard login page.
    Though, you can force the standard login page by adding 'nosso' parameter into the login URL, e.g. '/login?nosso'.
  identify_user_by_info: Provider's field to identify the user in Redmine

