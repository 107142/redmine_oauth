    Junto con los roles de grupo, crea el grupo que falte a partir del valor decodificado del claim y añade al usuario.
    Desactivado por defecto.
  oauth_group_exclude_list_info: |
    Valores del claim que no deben crearse como grupos. Separados por coma o salto de línea.
    No afecta a los grupos que ya existen.
  oauth_login_role_name_info: |
    Valores del claim que permiten el acceso. Separados por coma o salto de línea. Vacío = 'user'.
  oauth_admin_role_name_info: |
    Valores del claim que otorgan administrador de Redmine (y acceso). Separados por coma o salto de línea.
    Vacío = 'admin'.
